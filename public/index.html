<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFL Fantasy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="brand-mark">MFL</span> Fantasy</a>
    <nav id="nav"></nav>
    <div id="auth"></div>
  </header>
  <main id="view" aria-live="polite"></main>

  <dialog id="login-dialog">
    <form method="dialog" id="login-form">
      <h2>Enter PIN</h2>
      <p class="muted">Your team PIN lets you set your lineup. The commissioner PIN unlocks admin pages.</p>
      <input id="login-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
      <p id="login-error" class="error" hidden></p>
      <div class="row-end">
        <button type="button" class="btn ghost" id="login-cancel">Cancel</button>
        <button type="submit" class="btn">Log in</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
